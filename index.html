<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>3D 极速狂飙 - 全场景漫游</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <!-- 3D WebGL Canvas 容器 -->
  <div id="game-container">
    <canvas id="game" aria-label="3D赛车游戏画布"></canvas>
  </div>

  <header class="topbar">
    <div>
      <div class="eyebrow">3D ADVENTURE RACER</div>
      <div class="brand" id="brandTitle">COUNTRY ROAD</div>
    </div>
    
    <!-- 顶栏快速切场景按钮 -->
    <div class="topbar-actions">
      <div class="quick-scene-select">
        <select id="quickSceneSelect" aria-label="切换场景">
          <option value="country">🌾 乡间小路</option>
          <option value="island">🏝️ 逃离荒岛</option>
          <option value="jungle">🌴 丛林狂飙</option>
          <option value="river">🌊 沿河峡谷</option>
        </select>
      </div>
      <div class="server">
        <span id="serverDot" class="dot"></span>
        <span id="serverText">在线</span>
      </div>
    </div>
  </header>

  <section class="hud">
    <div class="metric">
      <strong id="speed">0</strong>
      <span>KM/H 速度</span>
    </div>
    <div class="metric">
      <strong id="score">0</strong>
      <span>探索得分</span>
    </div>
    <div class="metric">
      <strong id="best">0</strong>
      <span>最高纪录</span>
    </div>
  </section>

  <aside class="leaderboard" aria-label="排行榜">
    <div class="panel-title">
      <span>🏆 车王排行榜</span>
      <button id="refreshRanks" title="刷新排行榜">刷新</button>
    </div>
    <ol id="leaderboardList">
      <li>正在读取排行榜...</li>
    </ol>
  </aside>

  <div class="nitro" aria-label="氮气槽">
    <div id="nitroBar"></div>
  </div>

  <div class="controls">
    <button id="left" aria-label="向左转">&larr;</button>
    <button class="boost" id="boost" aria-label="氮气喷射">NITRO<br><span style="font-size:9px;opacity:0.85">爆发</span></button>
    <button id="right" aria-label="向右转">&rarr;</button>
  </div>

  <div class="overlay" id="overlay">
    <div class="menu">
      <div class="kicker">3D 极速自然探索引擎</div>
      <h1 id="title">极速狂飙 3D</h1>
      <p id="message">真实大自然风景！躲避前方车流，收集金币，按下 NITRO 氮气破风冲刺！</p>

      <!-- 场景选择器 -->
      <div class="theme-selector">
        <div class="theme-label">选择赛道主题地图</div>
        <div class="theme-chips">
          <button class="theme-chip active" data-theme="country" type="button">
            <span class="chip-icon">🌾</span>
            <span class="chip-name">乡间小路</span>
          </button>
          <button class="theme-chip" data-theme="island" type="button">
            <span class="chip-icon">🏝️</span>
            <span class="chip-name">逃离荒岛</span>
          </button>
          <button class="theme-chip" data-theme="jungle" type="button">
            <span class="chip-icon">🌴</span>
            <span class="chip-name">丛林狂飙</span>
          </button>
          <button class="theme-chip" data-theme="river" type="button">
            <span class="chip-icon">🌊</span>
            <span class="chip-name">沿河峡谷</span>
          </button>
        </div>
      </div>

      <label class="name-field">
        <span>车手昵称</span>
        <input id="playerName" maxlength="16" placeholder="输入你的车手名">
      </label>
      <button class="start" id="start">启动出发</button>
      <div class="tips">A / ← 左转　D / → 右转　W / ↑ 加速　Space 氮气加速</div>
    </div>
  </div>

  <!-- 本地 Three.js 核心库 -->
  <script src="assets/three.min.js"></script>
  <script src="game.js?v=7"></script>
</body>
</html>
