# PlayCarGame — 游戏前端 + 同源 API（生产版：80 + 443）
# 由 deploy/bootstrap.sh 安装到 /etc/nginx/conf.d/game.yhj123.dpdns.org.conf
# 只接管 game.yhj123.dpdns.org，不影响其它站点（baota / convert / test / 3xui / emby）

server {
    listen 80;
    server_name game.yhj123.dpdns.org;

    # certbot webroot 续期
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name game.yhj123.dpdns.org;

    ssl_certificate     /etc/letsencrypt/live/game.yhj123.dpdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.yhj123.dpdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 8m;

    # 前端 + /api 全部由 Node（127.0.0.1:3210）提供，前后端同源，无需 CORS
    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 以后加 WebSocket 联机可直接复用
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }

    # 静态资源弱缓存，脚本靠 ?v= 版本号刷新
    location /assets/ {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /index.html {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
